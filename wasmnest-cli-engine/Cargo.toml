# ==================== wasmnest-cli-engine：CLI 能力域机制骨架 ====================
# 抽根票据：7ZAI/wasmnest-lib#9（spec：.scratch/2026-10-25-cli-module/spec.md，会话产物）。
#
# 定位：命令目录 / argv 解析 / 帮助与补全 / 本机 IPC wire 契约的**纯机制**。CLI 前端
# （REPL / TUI）、无头宿主 bin、命令执行 handler、socket 传输循环全部住宿主装配侧；
# 本 crate 不假设任何运行时上下文——移动宿主不引用它，即天然「只有骨架、没有实现」。
#
# 依赖纪律（AGENTS §3.1「能力域默认形态 = 纯引擎 + 端口抽象」的收严版）：
# - 零 WIT（无 wit/ 目录，同 crypto-engine 先例——本域没有 guest 面：插件命令复用
#   内核既有 `command` 导出与分发，一期零契约变更零 bump）；
# - 零 wasm / 零异步运行时（目录与解析是纯函数；socket accept 等异步面住装配侧）；
# - 内部依赖仅 wasmnest-contract（零依赖共享词汇：兜底语义码）。**不依赖**
#   server-base：`WireError` 是纯 wire 类型，宿主错误 → 语义码的映射住宿主侧
#   （2026-11-08 P0：此前为复用 `AppError` 枚举把桌面 server 整条依赖链拖进 CLI）。

[package]
name = "wasmnest-cli-engine"
version = "0.0.1"
description = "WasmNest CLI 能力域机制骨架：内建命令目录（词汇真源）+ argv 解析 + 帮助与补全 + 本机 IPC wire 帧契约。默认形态 = 纯机制（零 WIT / 零 wasm / 零异步运行时 / 零内部 crate 依赖），WireError 是纯 wire 类型、域错误映射住宿主侧"
authors = ["binblink"]
license = "MIT"
repository = "https://github.com/7ZAI/wasmnest-lib"
edition = "2021"

# 内部 crate：只经 sibling path / git tag 被三仓消费，无 crates.io 发布计划
publish = false

[dependencies]
# 零依赖共享词汇（兜底语义码 DEFAULT_ERROR_CODE）——本 crate 不需要宿主错误信封：
# 2026-11-08（P0）摘掉 server-base 依赖边，WireError 是纯 wire 类型，域错误映射住宿主。
wasmnest-contract = { path = "../wasmnest-contract", version = "0.0.1" }
# wire 帧 / 目录元数据的序列化（JSON 行分帧 + manifest cli 段解析）
serde = { version = "1", features = ["derive"] }
serde_json = "1"
