# ==================== wasmnest-p2p-engine：libp2p 机制引擎 ====================
# libp2p 能力包：P1 起 `wasmnest-server-peer-net` 的传输栈已换到本引擎的
# swarm/流上（原自管 TcpListener + tokio-rustls + rcgen 自签证书已删除）；
# host-peer WIT 面、信任列表语义、`peer:*` 事件词汇零变化。
#
# 依赖纪律（本 crate 的存在意义，对齐 `wasmnest-ws-client-engine` 先例）：
# 纯机制引擎形态——默认 = 零 WIT / 零 SDK / 零平台依赖 / **零内部 crate 依赖**
# （端口 trait 本 crate 自持，不引 server-base，任何宿主可直接引用）；只允许
# 机制级依赖，边界由 src/boundary_lock.rs（crate 内单测）钉死。

[package]
name = "wasmnest-p2p-engine"
version = "0.0.1"
description = "WasmNest libp2p 机制引擎：节点身份桥（node_id↔PeerId）+ swarm 生命周期 + 入站准入闸门 + 流协议名注册表。默认形态 = 纯引擎机制 + 端口抽象（零 WIT / 零 SDK / 零平台依赖 / 零内部 crate 依赖），任何宿主可直接引用"
authors = ["binblink"]
license = "MIT"
repository = "https://github.com/7ZAI/wasmnest-lib"
edition = "2021"

# 内部 crate：只经 sibling path / git tag 被三仓消费，无 crates.io 发布计划
publish = false

[features]
default = []
# T01/T02：libp2p Circuit Relay v2 **客户端**（跨 NAT 基线）。默认关闭——宿主按需
# 显式开启（`--features relay` 或依赖方 `features = ["relay"]`），保证未启用 relay
# 的构建（含 Android）依赖树与今天逐字一致。
#
# 依赖面影响（T01 验收项）：`libp2p/relay` 只拉入 `libp2p-relay`（纯 Rust 协议实现，
# 无 rustls / quinn / aws-lc-rs / openssl-sys）；relay 客户端构造函数需要 rand 0.10
# （与 `libp2p-swarm 0.48` 同版本轴，保证同一份 rand 在依赖图里）。
# relay **服务端**不属本 crate：独立守护进程 `wasmnest-relay`（T13）。
relay = ["libp2p/relay", "dep:rand"]

[dependencies]
# libp2p 机制引擎本体（2026-10-25 定版 0.57.1，MSRV Rust 1.88，本机 1.98.1 满足）。
# feature 显式收窄（default-features = false 去掉默认 dns——LAN 场景拨 IP 字面量
# 不需要 hickory 解析器；后续票据若需域名拨号再显式加回）：
# - tokio/tcp：异步运行时与 TCP 传输（socket2，Android 交叉编译无额外构建链）
# - noise/yamux：传输加密与流多路复用——**不启用 tls/quic**：那两个 feature 才会
#   拉 rustls/quinn；当前 feature 集经 `cargo tree` 核验，normal 与
#   aarch64-linux-android 目标树里 rustls / quinn / aws-lc / openssl-sys 均为零
#   （Android 禁 aws-lc-rs 的全仓纪律在 peer-net Cargo.toml 有先例注释）。
#   **注意**：libp2p-noise 在非 wasm 目标用 snow 的 `ring-resolver`——ring 是 C
#   构建（需 NDK clang，旧栈 rustls/ring 同款工具链），不是纯 Rust；`cargo check
#   --target aarch64-linux-android` 需 `CC_aarch64_linux_android` 指向 NDK clang。
# - ping：连接保活 + 对端静默死亡探测（对齐现役栈 socket2 keepalive 的意图）
# - macros：`#[derive(NetworkBehaviour)]` 组合行为
# - ed25519：节点身份密钥类型（node_id 派生强制 ed25519，非 ed25519 对端显性拒绝）
# 注意：**不启用 identify**——它会在连接建立即自动交换元信息，破坏「准入闸门放行前
# 零上层协议流量」的语义（现役栈闸门位在 TLS 握手后、协议分发前）；外部地址学习
# 属后续票据（QUIC/打洞批次）再评估引入。
libp2p = { version = "0.57.1", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "ping", "macros", "ed25519"] }
# 具名流协议控制（P1）：信任状态/传输批/共享目录/会话各跑一条 `/wasmnest/<域>/1`
# 流；协议名单一事实源见 `stream_proto`。0.5.0-alpha 与 libp2p 0.57.1 同锁步
# （libp2p-core 0.44 / libp2p-swarm 0.48，Android 目标树无新增构建链依赖）。
libp2p-stream = "0.5.0-alpha"
# 异步运行时（事件泵 / 准入确认任务 / 测试；spawn 在本 crate 编译单元可用——
# ws-client 与 peer-net 引擎同款先例）
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
# 事件泵驱动 swarm 的 Stream（select_next_some）
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# node_id = hex(SHA-256(raw ed25519 公钥 32B))——与 peer-net base/identity.rs 的
# 派生字节序逐字一致（跨 crate 线上不变量，identity_bridge 头注有对齐说明）
sha2 = "0.10"
hex = "0.4"
# 准入端口的 async trait（dyn 兼容；确认闸门要能挂起等宿主弹窗应答）
async-trait = "0.1"
# 机制级日志
tracing = "0.1"
# 引擎错误枚举
thiserror = "1"
# relay 客户端构造需要随机源（circuit reservation 的请求 id）。版本与
# `libp2p-swarm 0.48` 依赖的 rand 同轴（0.10），避免依赖图出现两份 rand。
# 仅 `relay` feature 开启时进入依赖树。
rand = { version = "0.10", optional = true }
