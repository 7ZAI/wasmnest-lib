# ==================== server lib 共享 target 目录 ====================
# server-lib-split（AGENTS §3 target 治理）：6 个 server lib 各自独立 crate，
# cargo 默认把产物写进各自 crate 根 target/；本文件让 cwd 在其下的一切 cargo
# 调用都落到**本仓根** target/server-libs（相对本 crate 根是 `../`——与宿主
# src-tauri/target、cross-end-tests/target 都分开的独立目录，避免与宿主/夹具/wasm-apps
# 产物混占）。
# 平台仓切 sibling 布局后本 crate 位于 `<WASMNEST>/wasmnest-lib/<crate>`（旧位置
# `<平台>/packages/<crate>` 深一层），旧写法 `../../target/server-libs` 会静默落到
# 三仓共同父目录；本行已按新深度收口，改后必须核验：
#   cd wasmnest-crypto-engine && cargo metadata --no-deps --format-version 1
# 其 `target_directory` 应为 `<wasmnest-lib>/target/server-libs`。
[build]
target-dir = "../target/server-libs"
