# ==================== 能力 crate 共享 target 目录 ====================
# 与 `packages/wasmnest-host-kit` / `packages/wasmnest-discovery-engine` 共用**仓库根**
# `target/host-kits`：三者同属「机制内核 + 能力域」一族，依赖图（wasmtime +
# wasmtime-wasi + tokio）高度重叠，分开落点要把这份巨型依赖图再编一遍（实测 wasmtime
# 栈单个桶 14G 量级）。
#
# 本 crate 此前**没有**本文件（迁根前落 `桌面 packages/wasmnest-pty-engine`
# 时同样没有），产物默认写进 crate 根 `target/`——即为本 crate 单独再编一份 wasmtime。
# 2026-10-07「能力域 lib 迁根」时补齐（迁根后 crate 与机制内核同处仓库根 `packages/`，
# 同族关系比迁根前更明确）。**注意相对路径随 crate 深度变化**：改这一行后必须核验：
#   cd packages/wasmnest-pty-engine && cargo metadata --no-deps --format-version 1
# 其 `target_directory` 应为 `<repo>/target/host-kits`（写成 `../../target/host-kits`；
# 多写一个 `..` 会静默落到仓库根的**上级**目录——ADR 0035「落点与纪律」的同款坑）。
[build]
target-dir = "../../target/host-kits"