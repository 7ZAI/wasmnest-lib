# 能力仓 CI（7ZAI/wasmnest-lib#7）：fmt --check + 默认形态依赖门禁 + 按 crate 遍历
# cargo test。
#
# 仓形态约束（AGENTS.md §1 / §4）：无根 workspace——20 个顶层 crate 平铺仓根、
# 各自 Cargo.toml / Cargo.lock，一个 crate 一个 cargo 调用；不存在「仓级 cargo
# test」。夹具 crate（wasmnest-host-kit/fixtures/*、wasmnest-wasm-core/fixtures/*）
# 在二层目录，不入 `*/Cargo.toml` 顶层遍历面，也不入 CI（wasm 夹具另需目标端
# 工具链，随平台仓 / 测试仓侧构建）。
#
# 编译时长大头（CI 时长预估）：wasmnest-host-kit 默认形态**非可选**依赖
# wasmtime 48 + wasmtime-wasi(p3)（数 GB 级编译产物，单 crate 冷编译十分钟级）；
# server-core / server-http / server-websocket 拉 actix 栈；其余 crate 分钟级。
# 5 个能力域 crate（discovery / pty / http / websocket / peer-net）的 wasmtime 是
# optional 依赖且 default = []，默认形态不参与编译。**P0（2026-11-08）后不再有
# crate 默认拉 tauri**：server-base 的 `tauri-compat` 默认关、桌面宿主显式开启，
# 故 CI 不再安装 webkit2gtk 等仅服务 Tauri 的系统包。缓解措施：sccache——仓根
# .cargo/config.toml 强制 rustc-wrapper，按其注释口径在 CI 用
# mozilla/sccache-action 安装并压小缓存（2GiB），跨 crate / 跨 run 复用同一份
# 依赖图缓存。
#
# 锁口径：各 crate Cargo.lock 随仓库跟踪，但部分残留旧内部版本号（AGENTS §4.4 /
# §8 已知状态），CI **不加 --locked**——首次解析自动刷新仅在 run 内生效不入库；
# 待全量刷新收口后可再收紧（见票 7 遗留）。

name: ci

on:
  pull_request:
  # **push 不触发**（用户 2026-10-28 定：四仓 `dev` 推送一律不跑 GitHub CI）。本仓唯一
  # 常驻远端分支就是 `dev`，所以等于没有 push 触发；验证靠本地（逐 crate `cargo fmt --check`
  # + `cargo test`）+ 显式手跑。
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check（按 crate 遍历，覆盖全部 20 个顶层 crate）
        run: |
          set -eu
          for d in */Cargo.toml; do
            echo "== cargo fmt --check ${d%/Cargo.toml}"
            cargo fmt --manifest-path "$d" --check
          done
          # fmt 覆盖 wasmnest-wasm-core：cargo fmt 不做依赖解析，独立克隆可跑
          #（与 test job 的例外登记不同，见该 job 注释）。

  default-form-deps:
    name: default-form-deps
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 门禁只解析依赖图（不编译）：cargo tree 需要 registry 索引，全新检出先 fetch。
      - name: cargo fetch（逐 crate 补 registry 索引）
        run: |
          set -eu
          for d in */Cargo.toml; do
            cargo fetch --manifest-path "$d"
          done
      # 判据真源 = scripts/check-default-form-deps.sh（本地与 CI 同一条命令）。
      # 失败会打印违规包与 `cargo tree -i` 反向依赖路径。
      - name: 默认形态依赖门禁（tauri / actix / rusqlite / sysinfo / notify / inotify）
        run: sh scripts/check-default-form-deps.sh

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # 仓根 .cargo/config.toml [env] 注释口径：CI 压小 sccache 缓存（2GiB，
      # force=false 时外部值优先生效）
      SCCACHE_CACHE_SIZE: "2147483648"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla/sccache-action@v0.0.7
      # 无 apt 步骤：P0（2026-11-08）后 test 遍历面内没有任何 crate 默认拉 tauri
      # （server-base 的 tauri-compat 默认关；wasm-core 是登记例外、不进本遍历）。
      # 若将来某个 crate 重新默认依赖 GUI 框架，默认形态依赖门禁会先红。
      - name: cargo test（按 crate 遍历）
        run: |
          set -eu
          for d in */Cargo.toml; do
            crate="${d%/Cargo.toml}"
            if [ "$crate" = "wasmnest-wasm-core" ]; then
              # 登记例外（fail-visible，非静默跳过）：desktop-assembly（默认
              # feature）依赖未发布的桌面 SDK crate wasmnest-plugin-api 0.0.1
              #（registry 不存在），独立克隆无法解析依赖图；本仓内测试唯一合法
              # 向量是 §4.2 逃生阀（--config 把补丁指回平台仓工作树 SDK，依赖
              # R1 sibling 检出——CI 单仓检出无此路径；且平台装配 `-p` 测试亦
              # 不可行：非 workspace 成员 + dev-deps 被 cargo 拒绝，2026-10-27
              # 实测）。该 crate 单测经开发侧逃生阀覆盖；结构不变量由平台仓
              # 读源码锁钉住；本仓 fmt 门禁仍覆盖它。
              echo "::warning::skip cargo test: $crate（未发布 SDK 版本依赖无法独立解析；单测经开发侧逃生阀覆盖，AGENTS §4.2）"
              continue
            fi
            echo "== cargo test $crate"
            cargo test --manifest-path "$d"
          done
